name: Report a problem with a card
description: Wrong, outdated, or unclear information on a flashcard
title: "[card] "
labels: ["card-feedback"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping fix the flashcards! The card details below were filled in by the app.
  - type: input
    id: card
    attributes:
      label: Card
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Question on the card
  - type: input
    id: reference
    attributes:
      label: Reference shown on the card
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      placeholder: e.g. The hours are out of date, a regulation number is wrong, a typo…
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should it say?
      description: Include the regulation, AC, or handbook section if you can.
