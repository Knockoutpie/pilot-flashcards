<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Oral Exam">
  <title>Pilot Oral Exam Flashcards</title>
  <link rel="icon" href="favicon.ico">
  <style>
    /* matches the app background so a (re)load never flashes white or shows placeholder text */
    html, body { background: #1a1a2e; margin: 0; }
    @media (prefers-color-scheme: light) { html:not([data-theme="dark"]), html:not([data-theme="dark"]) body { background: #f5f5f5; } }
  </style>
  <script>
    try { var s = JSON.parse(localStorage.getItem('pofc.v2') || '{}').settings || {};
      if (s.theme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.documentElement.style.background = '#f5f5f5'; } } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css?v=2.4.0">
</head>
<body>
  <div id="app"></div>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script src="core.js?v=2.4.0"></script>
  <script src="app.js?v=2.4.0"></script>
</body>
</html>
